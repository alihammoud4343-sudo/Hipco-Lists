name: Instant alert test
on:
  push:
    paths: ['tools/trigtest_run.json']
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Remove wrongly timed backfill row, then add it at the real time
        run: |
          U=$(grep -o 'supabaseUrl: "[^"]*"' config.js | cut -d'"' -f2); K=$(grep -o 'anonKey: "[^"]*"' config.js | cut -d'"' -f2); C=$(grep -o 'dbCode: "[^"]*"' config.js | cut -d'"' -f2)
          curl -s -o /dev/null -w "del %{http_code}\n" -H "apikey: $K" -H "x-hipco: $C" -X DELETE "$U/rest/v1/kv?col=eq.alerts&id=eq.1791366360000"
          node tools/backfill_alert.mjs SL124 1791369960000
