name: Instant alert test
on:
  push:
    paths: ['tools/trigtest_run.json']
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert, update, delete a test inquiry and reminder
        run: |
          U=$(grep -o 'supabaseUrl: "[^"]*"' config.js | cut -d'"' -f2); K=$(grep -o 'anonKey: "[^"]*"' config.js | cut -d'"' -f2); C=$(grep -o 'dbCode: "[^"]*"' config.js | cut -d'"' -f2)
          H=(-H "apikey: $K" -H "x-hipco: $C" -H "Content-Type: application/json")
          post(){ curl -s -o /dev/null -w "%{http_code}\n" "${H[@]}" -H "Prefer: resolution=merge-duplicates,return=minimal" -X POST "$U/rest/v1/kv" -d "$1"; }
          post '{"col":"inquiries","id":"zz-test-inq","data":{"no":"INQ-999","salesman":"Ahmad","client":"Dbouk International","product":"SBS 250gsm (TEST)","qty":"20 MT","country":"Lebanon","status":"open","createdAt":'$(date +%s000)'}}'
          sleep 120
          curl -s -o /dev/null -w "del %{http_code}\n" "${H[@]}" -X DELETE "$U/rest/v1/kv?col=eq.inquiries&id=eq.zz-test-inq"
