name: Instant alert test
on:
  push:
    paths: ['tools/trigtest_run.json']
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A WhatsApp-sent tick must NOT create an alert
        run: |
          U=$(grep -o 'supabaseUrl: "[^"]*"' config.js | cut -d'"' -f2); K=$(grep -o 'anonKey: "[^"]*"' config.js | cut -d'"' -f2); C=$(grep -o 'dbCode: "[^"]*"' config.js | cut -d'"' -f2)
          H=(-H "apikey: $K" -H "x-hipco: $C" -H "Content-Type: application/json")
          cnt(){ curl -s "${H[@]}" "$U/rest/v1/kv?select=id&col=eq.alerts" | python3 -c "import sys,json;print(len(json.load(sys.stdin)))"; }
          B=$(cnt)
          curl -s -o /dev/null -w "%{http_code}\n" "${H[@]}" -H "Prefer: resolution=merge-duplicates,return=minimal" -X POST "$U/rest/v1/kv" -d '{"col":"sent","id":"zz-test-sent","data":{"salesman":"Ahmad","offer":"sl124","client":"Test","sentAt":1}}'
          sleep 10
          A=$(cnt)
          curl -s -o /dev/null "${H[@]}" -X DELETE "$U/rest/v1/kv?col=eq.sent&id=eq.zz-test-sent"
          sleep 5
          Z=$(cnt)
          echo "::notice title=result::alerts before=$B after-sent=$A after-delete=$Z"
