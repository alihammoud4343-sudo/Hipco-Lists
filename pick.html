<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HIPCO – choose your lines</title>
<style>
  :root{ --navy:#1B3A7A; --ink:#0F1B3D; --ink2:#5A6687; --line:#E3E7F0; --bg:#F1F3F8; --yellow:#FFE033; --wa:#25D366; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; padding-bottom:calc(120px + env(safe-area-inset-bottom,0px)); }
  header{ background:linear-gradient(160deg,#27499A,#0B1A3F); color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px; }
  header img{ height:40px; display:block; }
  header h1{ margin:12px 0 2px; font-size:20px; font-weight:700; }
  header p{ margin:0; font-size:13px; opacity:.85; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 12px; }
  .how{ background:#FFF8CC; border:1px solid #F0DD6B; border-radius:12px; padding:10px 12px; margin:12px 0; font-size:13.5px; }
  .how b{ background:var(--yellow); padding:0 4px; border-radius:3px; }
  .name{ width:100%; font:inherit; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#fff; margin-bottom:6px; }
  .sec{ margin:16px 2px 6px; font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--navy); display:flex; justify-content:space-between; gap:10px; }
  .row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:12px; padding:0 12px 0 0; margin-bottom:6px; min-height:54px; font:inherit; color:var(--ink); cursor:pointer; overflow:hidden; }
  .row .n{ flex:none; width:54px; align-self:stretch; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:var(--navy); background:#EAEEF6; }
  .row .t{ flex:1; min-width:0; font-weight:600; font-size:14px; }
  .row .t small{ display:block; font-weight:500; color:var(--ink2); font-size:12.5px; margin-top:1px; }
  .row .w{ flex:none; font-weight:800; font-size:15px; white-space:nowrap; }
  .row.on{ background:var(--yellow); border-color:#E0BE00; }
  .row.on .n{ background:#F2C800; color:#0F1B3D; }
  .row.on .t small{ color:#4a4000; }
  .empty{ text-align:center; padding:60px 16px; color:var(--ink2); }
  .bar{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); box-shadow:0 -6px 20px rgba(15,27,61,.1); }
  .bar .in{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  .sum{ font-size:13.5px; color:var(--ink2); min-height:20px; }
  .sum b{ color:var(--ink); background:var(--yellow); padding:1px 6px; border-radius:5px; }
  .btns{ display:flex; gap:8px; }
  .btns button{ flex:1; height:50px; border:0; border-radius:14px; font:700 15px inherit; font-family:inherit; cursor:pointer; }
  #send{ background:var(--wa); color:#fff; flex:2; } #send[disabled]{ opacity:.45; }
  #clr{ background:#EAEEF6; color:var(--navy); }
</style></head>
<body>
<header><img src="img/logo-white.png" alt="HIPCO"><h1 id="ttl">Choose your lines</h1><p id="sub">اختر البنود المطلوبة</p></header>
<div class="wrap">
  <div class="how">Tap the numbered lines you want — they turn <b>yellow</b>. Then press <b>Send</b> and pick your HIPCO contact in WhatsApp.<br><span dir="rtl">اضغط على أرقام البنود المطلوبة لتصبح صفراء ثم اضغط إرسال.</span></div>
  <input id="cn" class="name" type="text" placeholder="Your company name · اسم الشركة" autocomplete="organization">
  <div id="list"></div>
</div>
<div class="bar"><div class="in"><div class="sum" id="sum">Nothing selected yet</div><div class="btns"><button id="clr" type="button">Clear</button><button id="send" type="button" disabled>Send on WhatsApp ▸</button></div></div></div>
<script>
(function(){
  var ref = (new URLSearchParams(location.search).get('ref') || '').toUpperCase(), sel = {}, rows = [];
  var KEY = 'hipco_pick_' + ref, listEl = document.getElementById('list');
  function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  try{ sel = JSON.parse(ls(KEY) || '{}') || {}; }catch(e){ sel = {}; }
  document.getElementById('cn').value = ls('hipco_pick_name') || '';
  function split(t){   // "CLASSIC FBB BSIM 260 95.3 x 116.8 19.72" -> description + tons (last number)
    var m = /^(.*?)\s+(\d+(?:\.\d+)?)$/.exec(t); return m ? { d: m[1], w: m[2] } : { d: t, w: '' };
  }
  function draw(){
    var h = '', secOpen = false;
    rows.forEach(function(r){
      if(r.h){ var m = /^(.*?)\s+([\d.,]+\s*MT)$/.exec(r.h); h += '<div class="sec"><span>' + esc(m ? m[1] : r.h) + '</span><span>' + esc(m ? m[2] : '') + '</span></div>'; return; }
      var s = split(r.t);
      h += '<button type="button" class="row' + (sel[r.n] ? ' on' : '') + '" data-n="' + r.n + '"><span class="n">' + r.n + '</span><span class="t">' + esc(s.d) + '</span><span class="w">' + esc(s.w) + (s.w ? ' <small style="font-weight:600;font-size:11px">MT</small>' : '') + '</span></button>';
    });
    listEl.innerHTML = h; sum();
  }
  function chosen(){ return rows.filter(function(r){ return r.n && sel[r.n]; }); }
  function sum(){
    var c = chosen(), t = 0; c.forEach(function(r){ t += parseFloat((split(r.t).w) || 0) || 0; });
    document.getElementById('sum').innerHTML = c.length ? '<b>' + c.map(function(r){ return r.n; }).join(', ') + '</b> &nbsp;·&nbsp; ' + c.length + ' line' + (c.length > 1 ? 's' : '') + ' · ' + t.toFixed(2) + ' MT' : 'Nothing selected yet · لم تختر شيئاً';
    document.getElementById('send').disabled = !c.length;
  }
  listEl.addEventListener('click', function(e){
    var b = e.target.closest('.row'); if(!b) return; var n = b.getAttribute('data-n');
    if(sel[n]) delete sel[n]; else sel[n] = 1; b.classList.toggle('on', !!sel[n]); ls(KEY, JSON.stringify(sel)); sum();
  });
  document.getElementById('cn').addEventListener('input', function(){ ls('hipco_pick_name', this.value); });
  document.getElementById('clr').addEventListener('click', function(){ sel = {}; ls(KEY, '{}'); draw(); });
  document.getElementById('send').addEventListener('click', function(){
    var c = chosen(), name = document.getElementById('cn').value.trim(), t = 0; c.forEach(function(r){ t += parseFloat(split(r.t).w || 0) || 0; });
    var msg = 'HIPCO ' + ref + (name ? '\nClient: ' + name : '') + '\nI would like these lines / البنود المطلوبة:\n' + c.map(function(r){ var s = split(r.t); return '#' + r.n + ' – ' + s.d + (s.w ? ' – ' + s.w + ' MT' : ''); }).join('\n') + '\nTotal: ' + t.toFixed(2) + ' MT';
    var u = 'https://wa.me/?text=' + encodeURIComponent(msg);
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) location.href = 'whatsapp://send?text=' + encodeURIComponent(msg); else window.open(u, '_blank');
    setTimeout(function(){ if(!document.hidden) location.href = u; }, 1500);
  });
  fetch('data/lines.json', { cache: 'no-cache' }).then(function(r){ return r.json(); }).then(function(all){
    var d = all[ref];
    if(!d){ listEl.innerHTML = '<div class="empty">This list was not found.<br>لم يتم العثور على اللائحة</div>'; return; }
    document.getElementById('ttl').textContent = 'Stocklot ' + ref + ' · choose your lines';
    document.getElementById('sub').textContent = (d.rows.filter(function(r){ return r.n; }).length) + ' lines available · اختر البنود المطلوبة';
    rows = d.rows; draw();
  }).catch(function(){ listEl.innerHTML = '<div class="empty">Could not load the list. Check your connection and try again.</div>'; });
})();
</script></body></html>
